name: eGun Monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # alle 5 Minuten (GitHub Cron ist "best effort", real ~5-15 Min)
  workflow_dispatch:           # manueller Start jederzeit möglich

permissions:
  contents: write              # damit seen_items.json zurück ins Repo committet werden kann

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Monitor ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_cloud.py

      - name: Gesehene Inserate speichern
        run: |
          git config user.name  "eGun Monitor Bot"
          git config user.email "actions@github.com"
          git add seen_items.json sniper_notified.json price_history.json telegram_state.json monitors.json sniper_watches.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: state aktualisiert [skip ci]"
          git push
